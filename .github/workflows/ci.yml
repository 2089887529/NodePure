name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: test -z "$(gofmt -l cmd pkg)"
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go test ./... -count=1 -timeout=120s
      - run: go test -race ./... -count=1 -timeout=180s
      - run: go vet ./...
      - run: node --test web/test/*.test.cjs
      - name: Compile supported targets
        run: |
          for platform in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS=${platform%/*} GOARCH=${platform#*/} CGO_ENABLED=0 go build -trimpath -o /tmp/nodepure-build ./cmd/server
          done
      - name: Build container
        run: docker build -t nodepure:ci .
